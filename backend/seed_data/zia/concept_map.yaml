# Every slug, title, section anchor and URL below was confirmed against the LIVE Zia
# Tutor AI MCP on 2026-09-03 (corpus generation 62) via outline_agent_factory and
# search_agent_factory. Nothing here is inferred from a lesson title.
#
# `mapped: false` marks an objective with no real lesson behind it. Those rows are
# deliberate -- an explicit coverage gap is useful, an omission is indistinguishable
# from an unseeded table.

