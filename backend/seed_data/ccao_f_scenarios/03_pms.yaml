scenario:
  external_id: CCAO-F-PMS-SCN-001
  domain_code: PMS
  title: "The Latency Budget"
  content_version: 2
  active: true
  difficulty: 2
  source_reference: >-
    Originally authored for ClaudeCertMastery. Grounded in the CCAO-F Product & Model
    Selection domain description (backend/seed_data/ccao_f/03_pms.yaml). Not derived
    from any certification exam, course, transcript, or third-party teaching material.
  setup_text: >-
    A team is building a live chat widget that needs to feel conversational, which
    means replies inside about two seconds. Every message, including short ones like
    "thanks" or "ok", is currently sent to the largest and most capable Claude tier.
    Users have started complaining that even trivial exchanges feel sluggish.
  steps:
    - position: 1
      type: mcq
      prompt: >-
        What should the team do?
      hints:
        - position: 1
          penalty_bps: 1000
          text: >-
            Ask what a short acknowledgment message actually needs from the model,
            compared to what the largest tier is optimized to provide.
      options:
        - label: A
          text: >-
            Keep using the largest tier for everything, since more capability can
            only help output quality.
          correct: false
          rationale: >-
            Capability is not free -- larger tiers cost more latency and money, and
            a simple acknowledgment does not need or benefit from that extra
            capability.
          misconception_tag: capability_always_wins
        - label: B
          text: >-
            Add caching for common responses instead of changing which tier handles
            which message.
          correct: false
          rationale: >-
            Caching helps for genuinely repeated inputs, but most live chat messages
            are unique text. It does not address the root cause: every message,
            regardless of complexity, is paying the slowest tier's latency.
          misconception_tag: caching_fixes_latency
        - label: C
          text: >-
            Route short, simple messages to a faster and smaller tier, and reserve
            the largest tier for messages that need deeper reasoning.
          correct: true
          rationale: >-
            Latency and cost scale with the tier used. Matching the tier to the
            task's actual complexity avoids paying the largest tier's latency cost
            for a one-word acknowledgment.
    - position: 2
      type: mcq
      prompt: >-
        Tiered routing by message length is in place and working well for most
        traffic. A user then sends a short but genuinely difficult troubleshooting
        question, which gets routed to the fast tier because the message itself is
        short, and receives a shallow, unhelpful answer. What should the team do?
      options:
        - label: A
          text: >-
            Keep routing by message length, but raise the length threshold so more
            messages qualify for the larger tier.
          correct: false
          rationale: >-
            Raising the threshold only shifts which short messages get
            miscategorized. It does not fix the underlying problem of using length
            as a stand-in for complexity.
          misconception_tag: length_as_complexity
        - label: B
          text: >-
            Route by an estimate of the task's actual complexity or intent, not by
            message length, since a short message can still require deep reasoning.
          correct: true
          rationale: >-
            Message length and task complexity are different signals. A one-line
            troubleshooting question can be harder than a five-line greeting, so the
            routing signal itself needs to change, not just where its threshold
            sits.
